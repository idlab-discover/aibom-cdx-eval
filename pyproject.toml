[project]
name = "aibomgen-eval"
version = "0.1.0"
description = "Evaluation and benchmarking framework for aibomgen-cli and peer AIBOM tools"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.scripts]
eval = "orchestrator.run_benchmark:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "runners", "scoring", "analysis"]
