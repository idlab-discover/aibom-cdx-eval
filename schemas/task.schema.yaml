$schema: "http://json-schema.org/draft-07/schema#"
title: TaskDefinition
description: Schema for task definition files in benchmarks/tasks/
type: object
required: [task_id, name, description, tools, datasets, primary_metric, scorers]
properties:
  task_id:
    type: string
  name:
    type: string
  description:
    type: string
  tools:
    type: array
    items:
      type: string
  datasets:
    type: array
    items:
      type: object
      required: [id, path, type]
      properties:
        id:    { type: string }
        path:  { type: string }
        type:
          type: string
          enum: [model-id-list, model-id-list-labeled, source-dir]
        ground_truth: { type: string }
  primary_metric:
    type: string
    enum: [completeness_pct, f1, tpr, files_found]
  scorers:
    type: array
    items:
      type: string
      enum: [completeness, conformance, discovery, discovery_filesystem, security]
